allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@nerima-games/mc-kernel@0.4.0'
# nanoid is a transitive dependency (vitest > @vitest/mocker > vite > postcss
# > nanoid) pulled in at 3.3.16 by the toolchain freeze to vitest 4.1.11.
# GHSA-2v37-7h3g-55p8: custom generators can loop indefinitely when size is
# zero, patched at >=3.3.18. Pinned here rather than waiting on vite/postcss
# to bump their own dependency.
overrides:
  nanoid: '>=3.3.18'
