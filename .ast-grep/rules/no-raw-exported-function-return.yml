id: no-raw-exported-function-return
language: TypeScript
severity: error
message: Use a branded type for exported function return values instead of raw number or string.
note: >-
  Only direct export declarations and function expressions or arrows assigned
  to exported variables are matched. Re-exports are not resolved; function
  bodies and local helpers are outside the signature. Literal `number` and
  `string` annotations and direct `Result.Result<number|string, ...>` success
  types are matched; replacement types are not checked for a brand.
files:
  - '**/src/**/*.ts'
  - '**/src/**/*.mts'
  - '**/src/**/*.cts'
utils:
  exported-function:
    any:
      - all:
          - kind: function_declaration
          - inside:
              kind: export_statement
              field: declaration
              stopBy:
                any:
                  - kind: function_declaration
                  - kind: function_expression
                  - kind: arrow_function
      - all:
          - kind: function_expression
          - inside:
              kind: export_statement
              field: declaration
              stopBy:
                any:
                  - kind: function_declaration
                  - kind: function_expression
                  - kind: arrow_function
      - all:
          - kind: arrow_function
          - inside:
              kind: export_statement
              field: declaration
              stopBy:
                any:
                  - kind: function_declaration
                  - kind: function_expression
                  - kind: arrow_function
  raw-result-value:
    any:
      - pattern:
          context: 'type X = Result.Result<number, $ERROR>'
          selector: generic_type
      - pattern:
          context: 'type X = Result.Result<string, $ERROR>'
          selector: generic_type
rule:
  any:
    - all:
        - kind: predefined_type
        - regex: '^(number|string)$'
        - inside:
            matches: exported-function
            field: return_type
            stopBy:
              any:
                - kind: function_declaration
                - kind: function_expression
                - kind: arrow_function
        - not:
            inside:
              any:
                - kind: function_type
                - kind: generic_type
                - kind: union_type
                - kind: intersection_type
                - kind: array_type
                - kind: tuple_type
              stopBy: end
    - all:
        - matches: raw-result-value
        - inside:
            matches: exported-function
            field: return_type
            stopBy:
              any:
                - kind: function_declaration
                - kind: function_expression
                - kind: arrow_function
        - not:
            inside:
              kind: function_type
              stopBy: end
