name: CI

on:
  push:
    branches: [main]
  pull_request:

# These are public repositories, so a fork PR runs this workflow. Nothing here
# needs write access, and an unset block inherits an org default that is not
# managed in Terraform.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Pinned to a commit, not the mutable tag: this is a third-party action
        # and a tag can be repointed at new code without any change here.
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        # --ignore-scripts: pnpm runs postinstall, and a fork PR can edit
        # package.json and the lockfile consistently and still satisfy
        # --frozen-lockfile. Nothing here needs a lifecycle script.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm typecheck

      # oxlint is provided by the Nix devShell (flake.nix), not a package.json
      # devDependency — see flake.nix's comment on why. Installing Nix just for
      # this one step is the repository's environment trade-off: one pinned
      # oxlint version instead of independently drifting npm-resolved versions.
      - name: Set up Nix
        uses: ./.github/actions/nix-setup
        with:
          cachix-cache: ${{ vars.CACHIX_CACHE }}
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Flake check
        run: nix flake check --all-systems

      - name: Lint
        run: nix develop --command pnpm lint

      - name: Test
        run: pnpm test

      - name: Package boundary
        run: pnpm package:verify

      # Hard gate: statements/branches/functions/lines are all thresholded at
      # 100% in vitest.config.ts. Run as a separate required
      # step from `pnpm verify`, not folded into it, so the fast verify loop
      # stays fast and the coverage report is always produced regardless.
      - name: Coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 7
